[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipscout"
version = "0.1.0"
description = "Finds highlights in game and stream recordings by reading the game's HUD, then cuts them into clips."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]
keywords = ["highlights", "clips", "valorant", "obs", "twitch", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
clipscout = "clipscout.cli:main"

[tool.setuptools.packages.find]
include = ["clipscout*"]

[tool.setuptools.package-data]
clipscout = ["games/*/*.json", "games/*/templates/*.png", "games/*/templates/*.md", "review/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
